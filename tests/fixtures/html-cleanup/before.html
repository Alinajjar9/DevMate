<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study tasks</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Pasted styling from an earlier draft. -->
  body { font-family: sans-serif; background: #eee; }
  .legacy-outline { border: 4px solid red; }
  <main>
    <h1>Study tasks</h1>
    <form id="task-form">
      <label for="task-name">Task</label>
      <input id="task-name" name="task" required>
      <button type="submit">Add task</button>
    </form>
    <ul id="tasks"></ul>
  </main>
  <script>
    document.querySelector('#task-form').addEventListener('submit', function (event) {
      event.preventDefault();
      console.log('legacy inline handler');
    });
  </script>
</body>
</html>
